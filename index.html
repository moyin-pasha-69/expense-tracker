<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="./css/customeStyle.css" />
    <link rel="stylesheet" href="./css/output.css" />
    <script
      src="https://kit.fontawesome.com/cccffbd662.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-[#9CB080] font-mono relative">
    <header class="bg-[#2B5748] w-full">
      <div class="max-w-[1440px] w-full mx-auto p-4">
        <h1
          class="w-full text-center flex justify-center items-center text-white font-bold text-2xl"
        >
          <p class="greet-message"></p>
          ,<span class="user-name">Moyin</span>
        </h1>
        <div
          class="tracker grid grid-cols-2 gap-4 p-2 sm:grid-cols-4 justify-center text-center items-center mt-4 text-[#fffdd0] bg-[#618764] rounded-3xl"
        >
          <article>
            <h2>Current Balance</h2>
            <p>
              <span class="symbol">₹</span><span class="current-amt"></span>
            </p>
          </article>
          <article>
            <h2>Income</h2>
            <p><span class="symbol">₹</span><span class="income-amt"></span></p>
          </article>
          <article>
            <h2>Expenses</h2>
            <p>
              <span class="symbol">₹</span><span class="expense-amt"></span>
            </p>
          </article>
          <article>
            <h2>Savings</h2>
            <p><span class="symbol">₹</span><span class="saving-amt"></span></p>
          </article>
        </div>
      </div>
    </header>

    <main
      class="max-w-[1440px] w-full mx-auto font-mono py-4 px-6 overflow-x-hidden"
    >
      <section
        class="toast-message-section sm:max-w-md max-w-sm w-full z-50"
      ></section>

      <section class="mb-4">
        <button
          class="add-trans-btn bg-[#618764] rounded-3xl py-2 px-4 font-bold text-lg text-white hover:bg-[#2B5748] cursor-pointer w-full text-center"
        >
          Add Transactions
        </button>
      </section>

      <section
        id="add-trans-form-section"
        class="add-trans-form hidden"
      ></section>

      <section id="trans-cart-section"></section>
    </main>
  </body>
  <script type="module" src="./js/app.js"></script>
</html>
